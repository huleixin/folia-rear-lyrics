name: Cloud Announcement Sync

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      mode:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tingyu-announcement-sync
  cancel-in-progress: false

jobs:
  sync:
    if: inputs.mode == 'announcement_sync'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish and verify announcement files
        env:
          PROMOTE_RUNNER_SECRET: ${{ secrets.PROMOTE_RUNNER_SECRET }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: node tingyu-android/tools/cloud-announcement-runner.mjs
