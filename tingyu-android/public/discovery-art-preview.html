<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>听屿 · 推荐页正式艺术素材预览</title>
<style>
  body { margin: 0; padding: 32px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #edf3f8; color: #203747; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0 0 28px; color: #49677D; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 1120px; }
  .card { background: #ffffff; border-radius: 18px; padding: 16px; box-shadow: 0 6px 24px rgba(32,55,71,0.06); }
  .card.wide { grid-column: 1 / -1; }
  .art { width: 100%; display: block; border-radius: 14px; object-fit: cover; }
  .meta { margin-top: 12px; font-size: 14px; font-weight: 600; }
  .sub { margin-top: 4px; font-size: 12px; color: #49677D; }
</style>
</head>
<body>
  <h1>听屿 · 推荐页正式艺术素材预览</h1>
  <p>以下为直接接入的优化 WebP 正式资源（Android 与 Web/Pad 共用 <code>public/assets/discovery/</code>）。</p>
  <div class="grid">
    <div class="card wide">
      <img class="art" style="aspect-ratio:16/7;" src="/assets/discovery/roaming.webp" alt="听屿漫游" />
      <div class="meta">听屿漫游（roaming.webp）</div>
      <div class="sub">1024×438 · 31.4 KB · 标题 #203747 / 副标题 #49677D / 按钮 #203F59</div>
    </div>
    <div class="card">
      <img class="art" style="aspect-ratio:1/1;" src="/assets/discovery/radar-style.webp" alt="风格雷达" />
      <div class="meta">风格雷达（radar-style.webp）</div>
      <div class="sub">768×768 · 55.0 KB</div>
    </div>
    <div class="card">
      <img class="art" style="aspect-ratio:1/1;" src="/assets/discovery/radar-time.webp" alt="时光雷达" />
      <div class="meta">时光雷达（radar-time.webp）</div>
      <div class="sub">768×768 · 55.3 KB</div>
    </div>
    <div class="card">
      <img class="art" style="aspect-ratio:1/1;" src="/assets/discovery/radar-explore.webp" alt="探索雷达" />
      <div class="meta">探索雷达（radar-explore.webp）</div>
      <div class="sub">768×768 · 61.5 KB</div>
    </div>
  </div>
</body>
</html>
