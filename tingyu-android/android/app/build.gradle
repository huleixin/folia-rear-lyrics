import groovy.json.JsonSlurper

// 当前文件：Folia Android 应用版本、SDK 与可选发布签名配置。

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def playbackTestBuild = (project.findProperty('tingyuPlaybackTest') == 'true')
def graphicsTestBuild = (project.findProperty('tingyuGraphicsDiagnostics') == 'true')

def packageJson = new JsonSlurper().parseText(file('../../package.json').text)
def playbackTestRevision = (packageJson.playbackTestRevision ?: 1) as int

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()

if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "io.github.huleixin.tingyu"
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }
    defaultConfig {
        buildConfigField 'boolean', 'COMPOSE_CHROME', (System.getenv('TINGYU_COMPOSE_CHROME') == 'false' ? 'false' : 'true')
        buildConfigField 'boolean', 'GLASS_LAB', (System.getenv('TINGYU_GLASS_LAB') == 'true' ? 'true' : 'false')
        buildConfigField 'boolean', 'NATIVE_PLAYBACK', (System.getenv('TINGYU_NATIVE_PLAYBACK') == 'false' ? 'false' : 'true')
        buildConfigField 'boolean', 'PLAYBACK_ENGINE_TEST', (playbackTestBuild || graphicsTestBuild).toString()
        buildConfigField 'boolean', 'GRAPHICS_DIAGNOSTICS', graphicsTestBuild.toString()
        applicationId (playbackTestBuild ? "io.github.huleixin.tingyu.playbacktest" : "io.github.huleixin.tingyu")
        manifestPlaceholders['tingyuAppLabel'] = playbackTestBuild ? '听屿播放测试' : '听屿'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (playbackTestBuild ? (packageJson.androidVersionCode as int) * 100 + playbackTestRevision : packageJson.androidVersionCode as int)
        versionName "${packageJson.version}${playbackTestBuild ? "-playback-test.${playbackTestRevision}" : graphicsTestBuild ? '-graphics-test.1' : ''}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true; compose true }
    kotlinOptions { jvmTarget = '21' }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    maven { url 'https://api.xposed.info/' }
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.ui:ui:1.10.3'
    implementation 'androidx.compose.foundation:foundation:1.10.3'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'io.github.kyant0:backdrop:1.0.6'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.github.Dimezis:BlurView:version-4.0.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 洛雪音源脚本的原生执行引擎（QuickJS）。1.0.5 是与本项目 Kotlin 2.3 兼容的最后一版，
    // 自带 arm64-v8a/armeabi-v7a/x86/x86_64，且 .so 已是 16KB 页对齐（Android 15+ 要求）。
    implementation 'io.github.dokar3:quickjs-kt-android:1.0.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.11.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation "junit:junit:$junitVersion"
    // Use the real JSON implementation for presentation-contract JVM tests.
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Prevent a test UI from being accidentally packaged as the normal application (or vice versa).
tasks.register('verifyPlaybackTestAssets') {
    doLast {
        def marker = file('src/main/assets/public/tingyu-playback-test.json')
        if (playbackTestBuild && marker.exists()) {
            def payload = new JsonSlurper().parse(marker)
            if (payload.version != android.defaultConfig.versionName || payload.packageName != android.defaultConfig.applicationId || payload.testBuild != true) throw new GradleException('Stale playback test assets; rebuild and copy the test web bundle')
        }
        if (playbackTestBuild != marker.exists()) throw new GradleException('Playback test flag and web assets do not match; rebuild and copy the correct web bundle')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyPlaybackTestAssets' }
