import groovy.json.JsonSlurper

// 当前文件：Folia Android 应用版本、SDK 与可选发布签名配置。

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def playbackTestBuild = (project.findProperty('tingyuPlaybackTest') == 'true')
def graphicsTestBuild = (project.findProperty('tingyuGraphicsDiagnostics') == 'true')

def packageJson = new JsonSlurper().parseText(file('../../package.json').text)
def playbackTestRevision = (packageJson.playbackTestRevision ?: 1) as int

// 构建标识：commit + 是否有未提交改动。写进 BuildConfig 并随宿主 register 上报，
// 用来区分「装的是不是刚构建的包」，避免旧包/新包混在一起判断。
def gitBuildId = "unknown"
try {
    def revision = ['git', 'rev-parse', '--short=8', 'HEAD'].execute(null, rootProject.projectDir).text.trim()
    def dirty = ['git', 'status', '--porcelain'].execute(null, rootProject.projectDir).text.trim()
    if (revision) gitBuildId = revision + (dirty.isEmpty() ? '' : '-dirty')
} catch (Exception ignored) {
    gitBuildId = 'unknown'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()

if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "io.github.huleixin.tingyu"
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }
    defaultConfig {
        buildConfigField 'boolean', 'COMPOSE_CHROME', (System.getenv('TINGYU_COMPOSE_CHROME') == 'false' ? 'false' : 'true')
        // 极简播放页 Compose 原生化的总开关。**默认开启**：它与上面的 COMPOSE_CHROME 同一套
        // 语义 —— 忘设环境变量的构建曾让 1.3.131/1.3.132 两次悄悄回退到 WebView 极简页
        // （BuildConfig 里是 false，手机上永远画的是旧页面）。回滚方式：TINGYU_COMPOSE_MINIMAL=false。
        // 关闭时 probe().minimalPlayer=false，JS 侧继续挂 WebView 极简页 —— 这就是回滚。
        buildConfigField 'boolean', 'COMPOSE_MINIMAL_PLAYER', (System.getenv('TINGYU_COMPOSE_MINIMAL') == 'false' ? 'false' : 'true')
        buildConfigField 'boolean', 'GLASS_LAB', (System.getenv('TINGYU_GLASS_LAB') == 'true' ? 'true' : 'false')
        // 液态玻璃参数预设（1.3.189 玻璃专项）。三组见 ChromeGlassPresets：
        //   official      = Kyant0 1.0.6 官方 LiquidBottomTabs 原值（64dp 底栏基线）
        //   proportional  = 听屿 54dp 底栏等比缩放（默认）
        //   crisp         = 低模糊/低折射，可读性与性能优先
        // 对比方式：TINGYU_GLASS_PRESET=official|proportional|crisp 分别出包。
        buildConfigField 'String', 'GLASS_PRESET', "\"${System.getenv('TINGYU_GLASS_PRESET') ?: 'proportional'}\""
        // 沉浸式毛玻璃顶栏（TopGlassBar）的 RenderEffect 模糊总开关（默认开启）。
        // 关闭时降级为同一形状的半透明底色玻璃（无模糊、无横带）。回滚方式：TINGYU_TOP_GLASS_BLUR=false。
        buildConfigField 'boolean', 'TOP_GLASS_BLUR', (System.getenv('TINGYU_TOP_GLASS_BLUR') == 'false' ? 'false' : 'true')
        buildConfigField 'boolean', 'NATIVE_PLAYBACK', (System.getenv('TINGYU_NATIVE_PLAYBACK') == 'false' ? 'false' : 'true')
        buildConfigField 'boolean', 'PLAYBACK_ENGINE_TEST', (playbackTestBuild || graphicsTestBuild).toString()
        buildConfigField 'boolean', 'GRAPHICS_DIAGNOSTICS', graphicsTestBuild.toString()
        buildConfigField 'String', 'BUILD_ID', "\"${packageJson.version}@${gitBuildId}\""
        applicationId (playbackTestBuild ? "io.github.huleixin.tingyu.playbacktest" : "io.github.huleixin.tingyu")
        manifestPlaceholders['tingyuAppLabel'] = playbackTestBuild ? '听屿播放测试' : '听屿'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (playbackTestBuild ? (packageJson.androidVersionCode as int) * 100 + playbackTestRevision : packageJson.androidVersionCode as int)
        versionName "${packageJson.version}${playbackTestBuild ? "-playback-test.${playbackTestRevision}" : graphicsTestBuild ? '-graphics-test.1' : ''}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Host Chromium may defer consuming modulepreload bodies. Serve packaged assets by
            // seekable APK descriptors instead of blocking pipe-writer threads on those bodies.
            noCompress 'html', 'js', 'css', 'json', 'wasm', 'woff', 'woff2', 'ttf', 'otf', 'svg'
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true; compose true }
    kotlinOptions { jvmTarget = '21' }
    testOptions {
        unitTests {
            // Robolectric 需要真实的合并清单与资源，才能渲染真实的 Compose 组合。
            includeAndroidResources = true
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        debug {
            // 真机联调直接覆盖安装 release 包：同一把签名，免去先卸载丢数据。
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    maven { url 'https://api.xposed.info/' }
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.ui:ui:1.10.3'
    implementation 'androidx.compose.foundation:foundation:1.10.3'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'io.github.kyant0:backdrop:1.0.6'
    // 沉浸式毛玻璃顶栏的渲染内核（Apache-2.0）。选 1.6.10：依赖 Compose 1.8.0 / Kotlin 2.1，
    // 低于本项目 1.10.3 / 2.3.10，Gradle 取高版本、不需要升级基础依赖；2.x 要求 Kotlin 2.4 +
    // Compose 1.12（会强制升级），故不采用。底部 Liquid Glass 仍由 kyant0 backdrop 负责，互不干扰。
    implementation 'dev.chrisbanes.haze:haze:1.6.10'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.github.Dimezis:BlurView:version-4.0.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 洛雪音源脚本的原生执行引擎（QuickJS）。1.0.5 是与本项目 Kotlin 2.3 兼容的最后一版，
    // 自带 arm64-v8a/armeabi-v7a/x86/x86_64，且 .so 已是 16KB 页对齐（Android 15+ 要求）。
    implementation 'io.github.dokar3:quickjs-kt-android:1.0.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.11.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation "junit:junit:$junitVersion"
    // Use the real JSON implementation for presentation-contract JVM tests.
    testImplementation 'org.json:json:20250517'
    // 真机不可用时的等价验证：Robolectric 的 NATIVE 图形栈把真实的 Compose 组合渲染成位图，
    // 极简页的截图与动效帧因此能在 JVM 上跑出来（不是模拟出来的贴图）。
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.compose.ui:ui-test-junit4:1.10.3'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.10.3'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.10.3'
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // androidx.test 传递依赖把 kotlin-stdlib-jdk7/jdk8 1.6.21 拉进 androidTest 变体，
    // 与主工程的 kotlin-stdlib 1.8.22（已内并 jdk7/jdk8 内容）撞类。显式对齐到空壳版本。
    androidTestImplementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    androidTestImplementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Prevent a test UI from being accidentally packaged as the normal application (or vice versa).
tasks.register('verifyPlaybackTestAssets') {
    doLast {
        def marker = file('src/main/assets/public/tingyu-playback-test.json')
        if (playbackTestBuild && marker.exists()) {
            def payload = new JsonSlurper().parse(marker)
            if (payload.version != android.defaultConfig.versionName || payload.packageName != android.defaultConfig.applicationId || payload.testBuild != true) throw new GradleException('Stale playback test assets; rebuild and copy the test web bundle')
        }
        if (playbackTestBuild != marker.exists()) throw new GradleException('Playback test flag and web assets do not match; rebuild and copy the correct web bundle')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyPlaybackTestAssets' }

/**
 * Release 的 R8 mapping 归档。
 *
 * 当前 release 关闭了 minify（minifyEnabled false），所以不会有 mapping.txt；这个任务在
 * 开启混淆后才会真正产出文件。保留 suffixed 版本是为了「一个 APK 对应一份 mapping」——
 * 只留 outputs/mapping/release/mapping.txt 会被下一次构建覆盖，事后无法还原旧包的栈。
 *
 * 用法：./gradlew :app:archiveReleaseMapping
 * 归档位置：app/build/outputs/mapping/release/mapping-<buildId>.txt
 */
tasks.register('archiveReleaseMapping') {
    doLast {
        def releaseDir = layout.buildDirectory.dir('outputs/mapping/release').get().asFile
        def mapping = new File(releaseDir, 'mapping.txt')
        if (!mapping.exists()) {
            logger.lifecycle("[mapping] ${mapping} 不存在：当前 release 未开启 minifyEnabled，无需归档")
            return
        }
        def target = new File(releaseDir, "mapping-${gitBuildId}.txt")
        target.bytes = mapping.bytes
        logger.lifecycle("[mapping] 已归档到 ${target}")
    }
}


// 本机 Robolectric 原生图形栈不可用时的兜底开关（默认关闭，不影响正常构建与 CI）：
//   ./gradlew :app:testDebugUnitTest -PtingyuSkipRenderTests=true
// 现象：Windows + JBR 21 下 RenderNodeNatives.nCreate / ColorSpace.<clinit> 直接段错误
// （app/hs_err_pid*.log 可查），9 个 Compose 渲染用例会把测试 JVM 一起带走；
// 其余 1000+ 纯逻辑用例照常可跑。图形栈正常的机器不要开这个开关。
if (project.hasProperty('tingyuSkipRenderTests')) {
    tasks.withType(Test).configureEach {
        filter {
            excludeTestsMatching "*MinimalScreenshotTest*"
            excludeTestsMatching "*MinimalParityTest*"
            excludeTestsMatching "*NativeSettingsTouchTest*"
            excludeTestsMatching "*PlayerSurfaceMotionTest*"
            excludeTestsMatching "*CoverStackControllerSkipTxTest*"
            excludeTestsMatching "*MinimalCoverStackTest*"
            excludeTestsMatching "*MinimalKaraokeFillTest*"
            excludeTestsMatching "*MinimalKaraokeRenderTest*"
            excludeTestsMatching "*MinimalLyricsViewportTest*"
        }
    }
}
